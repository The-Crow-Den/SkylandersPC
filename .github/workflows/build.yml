# SPDX-License-Identifier: GPL-3.0-or-later
# Build the renderer and native host, run every synthetic test, and on a tag or by
# hand package the launcher AppImage. Nothing here needs game files, keys or a GPU.
# The full build is slow, so it runs for release tags, pull requests and by hand
# (Actions > Build > Run workflow). A push to main runs only the Windows renderer
# compile, to keep its compiler cache warm: caches saved on main are the only ones a
# later tag build can restore, so releases recompile just what changed.
name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
env:
  # Header-only renderer dependencies Arch does not package, pinned as in LICENSES/dependencies.json.
  VMA_COMMIT: 1d8f600fd424278486eade7ed3e877c99f0846b1
  XBYAK_COMMIT: cd6bad3cad2e07a3e277c23d2b1f065320024717
jobs:
  native:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # SDL3, Zydis and robin-map are packaged on Arch but not on Ubuntu's runner image.
    container: archlinux:base-devel
    steps:
      - name: Build dependencies
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja python python-cryptography python-pillow \
            sdl3 fmt boost robin-map zydis miniz spirv-headers vulkan-headers vulkan-icd-loader \
            glslang xxhash ffmpeg libx11 libusb openssl glm
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Header-only dependencies
        run: |
          fetch() {  # repository commit destination
              git init -q "$3"
              git -C "$3" fetch -q --depth 1 "https://github.com/$1.git" "$2"
              git -C "$3" checkout -q FETCH_HEAD
          }
          fetch GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator "$VMA_COMMIT" "$RUNNER_TEMP/vma"
          fetch herumi/xbyak "$XBYAK_COMMIT" "$RUNNER_TEMP/xbyak"
      - name: Build renderer (libskyrender.so)
        run: |
          cmake -S renderer/gpu -B .local/renderer-build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSKY_RENDERER_LTO=OFF -DSKY_RENDERER_PGO=off -DVMA_INCLUDE_DIR="$RUNNER_TEMP/vma/include" \
            -DCMAKE_CXX_FLAGS="-isystem $RUNNER_TEMP/xbyak"
          cmake --build .local/renderer-build --target skyrender
      - name: Build native host
        run: |
          cmake -S native -B .local/native-gpu-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSKY_TLS_PREFLIGHT=ON -DSKY_RENDERER_ROOT="$PWD/renderer" -DSKY_RENDERER_LIBRARY="$PWD/.local/renderer-build/libskyrender.so"
          cmake --build .local/native-gpu-build
      - name: Native tests
        run: ctest --test-dir .local/native-gpu-build --output-on-failure
      - name: Synthetic tooling tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -v
      - name: Source and notice audit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/release_audit.py
          python3 tools/release_audit.py --tracked

  # The Linux release runtime is built on Ubuntu 22.04 so it runs on glibc 2.35
  # and newer (Ubuntu 22.04+, Debian 12, Fedora, Arch, SteamOS); see the script.
  linux-runtime:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Git for checkout
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: out/ubuntu-deps
          key: ubuntu-deps-${{ hashFiles('tools/linux-release/build-ubuntu.sh') }}
      - name: Build and bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/linux-release/build-ubuntu.sh
      - uses: actions/upload-artifact@v5
        with:
          name: SkylandersPC-linux-runtime
          path: out/linux-runtime
          include-hidden-files: true
          if-no-files-found: error

  # Windows port (docs/windows-port.md): MinGW under MSYS2 CLANG64, the toolchain the renderer's
  # platform/win32 layer targets. The native host builds its portable pieces and their tests so far.
  windows-native:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          pacboy: >-
            toolchain:p cmake:p ninja:p python:p pkgconf:p openssl:p zydis:p fmt:p boost:p glm:p sdl3:p
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build native host (portable subset)
        run: |
          cmake -S native -B .local/native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKY_TLS_PREFLIGHT=ON
          cmake --build .local/native-build
      - name: Native tests
        run: ctest --test-dir .local/native-build --output-on-failure

  windows-renderer:
    runs-on: windows-latest
    env:
      # A push to main only warms the compiler cache: no tests or packaging.
      WARM_ONLY: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      # The toolchain is updated each run, so compare compilers by content, not mtime.
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          pacboy: >-
            toolchain:p cmake:p ninja:p python:p pkgconf:p git:p sdl3:p fmt:p boost:p robin-map:p
            zydis:p spirv-headers:p vulkan-headers:p vulkan-loader:p glslang:p xxhash:p
            ffmpeg:p glm:p vulkan-memory-allocator:p openssl:p libusb:p ccache:p
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Header-only dependencies
        run: |
          git init -q "$RUNNER_TEMP/xbyak"
          git -C "$RUNNER_TEMP/xbyak" fetch -q --depth 1 https://github.com/herumi/xbyak.git "$XBYAK_COMMIT"
          git -C "$RUNNER_TEMP/xbyak" checkout -q FETCH_HEAD
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-renderer-${{ github.sha }}
          restore-keys: ccache-windows-renderer-
      - name: Build complete Windows host with static renderer
        id: full-build
        run: |
          xbyak="$(cygpath -m "$RUNNER_TEMP/xbyak")"
          cmake -S native -B .local/windows-full-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSKY_WINDOWS_FULL_HOST=ON -DSKY_TLS_PREFLIGHT=ON -DSKY_RENDERER_LTO=OFF \
            -DSKY_RENDERER_PGO=off -DCMAKE_CXX_FLAGS="-isystem $xbyak" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache -z
          cmake --build .local/windows-full-build
          ccache -s
      - name: Full host synthetic tests (no guest admission/game validation)
        if: env.WARM_ONLY != 'true'
        run: ctest --test-dir .local/windows-full-build --output-on-failure
      - name: Repeat the guest TLS loader test (flake hunt, informational)
        if: ${{ !cancelled() && steps.full-build.outcome == 'success' && env.WARM_ONLY != 'true' }}
        continue-on-error: true
        run: ctest --test-dir .local/windows-full-build --output-on-failure -R native-windows-loader --repeat until-fail:30
      - name: Windows bundle (source tree, host, its DLLs, launcher script)
        # Built even when a synthetic test fails, so the bundle can be tried.
        if: ${{ !cancelled() && steps.full-build.outcome == 'success' && env.WARM_ONLY != 'true' }}
        run: |
          dist=out/SkylandersPC-windows
          mkdir -p "$dist/.local/native-gpu-build"
          git config --global --add safe.directory "$(cygpath -m "$GITHUB_WORKSPACE")"
          # Byte-exact: the runner sets core.autocrlf, and CRLF would break the
          # hash-checked patch manifests and profiles.
          git -c core.autocrlf=false -c core.eol=lf archive HEAD | tar -x -C "$dist"
          if grep -rlI $'\r' "$dist/profiles" "$dist/patches"; then echo "CRLF in hash-checked files"; exit 1; fi
          host=.local/windows-full-build/skylanders-native-host.exe
          cp "$host" "$dist/.local/native-gpu-build/"
          # Every MSYS2 DLL the host loads; Windows system DLLs are not copied.
          ldd "$host" | awk '$3 ~ /^\/clang64\// {print $3}' | sort -u | xargs -r -I{} cp {} "$dist/.local/native-gpu-build/"
          ls "$dist/.local/native-gpu-build"
          # License inventory for those DLLs: owning package, version and license
          # from pacman, plus each package's license texts.
          mkdir -p "$dist/LICENSES/msys2"
          {
            echo '['; first=1
            for dll in "$dist"/.local/native-gpu-build/*.dll; do
              owner=$(pacman -Qoq "/clang64/bin/$(basename "$dll")")
              version=$(pacman -Q "$owner" | awk '{print $2}')
              license=$(pacman -Qi "$owner" | sed -n 's/^Licenses *: //p')
              url=$(pacman -Qi "$owner" | sed -n 's/^URL *: //p')
              [ -d "/clang64/share/licenses/${owner#mingw-w64-clang-x86_64-}" ] && cp -r "/clang64/share/licenses/${owner#mingw-w64-clang-x86_64-}" "$dist/LICENSES/msys2/" || true
              [ $first = 1 ] || echo ','; first=0
              printf '{"file": ".local/native-gpu-build/%s", "package": "%s", "version": "%s", "license": "%s", "source": "%s"}' \
                "$(basename "$dll")" "$owner" "$version" "$license" "$url"
            done
            echo; echo ']'
          } > "$dist/LICENSES/msys2-runtime.json"
          python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))), 'MSYS2 DLLs inventoried')" "$dist/LICENSES/msys2-runtime.json"
      - uses: actions/setup-python@v6
        if: ${{ !cancelled() && steps.full-build.outcome == 'success' && env.WARM_ONLY != 'true' }}
        with:
          python-version: '3.13'
      - name: Freeze the launcher (no Python needed on the player's PC)
        if: ${{ !cancelled() && steps.full-build.outcome == 'success' && env.WARM_ONLY != 'true' }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r tools/appimage/requirements.txt
          python -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r tools/appimage/requirements-windows-webengine.txt
          python -m pip install --quiet pyinstaller==6.16.0
          # Every tool module is a hidden import, so the stdlib/Qt they use is
          # frozen in; the tools themselves run from source beside the exe.
          $hidden = Get-ChildItem tools/*.py | Where-Object { $_.Name -notlike 'test*' -and $_.BaseName -ne 'frozen_entry' } | ForEach-Object { '--hidden-import', $_.BaseName }
          python -m PyInstaller --noconfirm --windowed --name SkylandersPC --icon tools/launcher_art/app-icon.ico --paths tools --distpath "$env:RUNNER_TEMP\frozen" --workpath "$env:RUNNER_TEMP\pyi" @hidden tools/frozen_entry.py
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item -Recurse "$env:RUNNER_TEMP\frozen\SkylandersPC\*" out/SkylandersPC-windows/
          # PyInstaller's Qt hooks add every QML plugin; the launcher and PC menu use widgets
          # and WebEngine only, so the qml folder is left out (and is not in the inventory).
          Remove-Item -Recurse -Force out/SkylandersPC-windows/_internal/PyQt6/Qt6/qml -ErrorAction SilentlyContinue
          # Smoke: the frozen exe runs a helper script and imports the launcher.
          $out = & out/SkylandersPC-windows/SkylandersPC.exe tools/game_prepare.py --help | Out-String
          if ($out -notmatch 'usage: game_prepare') { Write-Output $out; exit 1 }
          Set-Content "$env:RUNNER_TEMP\probe.py" "import sys; sys.path.insert(0, r'$PWD\out\SkylandersPC-windows\tools'); import launcher, run_session, overlay_session, pc_overlay; import PyQt6.QtWebEngineWidgets, PyQt6.QtWebChannel; print('frozen launcher imports ok')"
          $out = & out/SkylandersPC-windows/SkylandersPC.exe "$env:RUNNER_TEMP\probe.py" | Out-String
          Write-Output $out
          if ($out -notmatch 'imports ok') { exit 1 }
          python tools/windows_inventory_check.py out/SkylandersPC-windows
          if ($LASTEXITCODE) { exit 1 }
          # The PC menu's web engine must be inside the bundle, not on the player's PC.
          if (-not (Get-ChildItem -Recurse out/SkylandersPC-windows -Filter QtWebEngineProcess.exe)) { Write-Output 'QtWebEngineProcess.exe missing'; exit 1 }
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.full-build.outcome == 'success' && env.WARM_ONLY != 'true' }}
        with:
          name: SkylandersPC-windows
          path: out/SkylandersPC-windows
          include-hidden-files: true
          if-no-files-found: error
      - name: Library and manifest tests on Windows (informational)
        if: ${{ !cancelled() && steps.full-build.outcome == 'success' && env.WARM_ONLY != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v -s tests -p "test_game_*.py"
      - name: Python tests on Windows (informational)
        if: ${{ !cancelled() && steps.full-build.outcome == 'success' && env.WARM_ONLY != 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests 2>&1 | Tee-Object "$env:RUNNER_TEMP\python-tests.log" | Select-Object -Last 120

  appimage:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      # The build's Qt check (offscreen) still loads Qt's GL and font libraries.
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64
      - name: Build launcher AppImage
        run: tools/appimage/build-launcher-appimage.sh "$PWD/out/dist/Skylanders-Launcher-x86_64.AppImage"
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out/dist/Skylanders-Launcher-x86_64.AppImage --appimage-extract-and-run --python -c \
            'import cryptography.hazmat.primitives.ciphers; from PyQt6.QtWidgets import QApplication; QApplication([])'
      - uses: actions/upload-artifact@v5
        with:
          name: Skylanders-Launcher-x86_64.AppImage
          path: out/dist/Skylanders-Launcher-x86_64.AppImage
          if-no-files-found: error

  # A v* tag publishes a draft release. Every binary ships beside the complete
  # corresponding source it was built from: this commit, its submodules and the
  # pinned header-only dependencies, as one archive.
  release:
    name: Official release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, linux-runtime, windows-renderer, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Tag matches launcher version
        run: |
          grep -q "^## SkylandersPC ${GITHUB_REF_NAME#v} " RELEASE_NOTES.md || { echo "RELEASE_NOTES.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          version=$(python3 -c "import sys;sys.path.insert(0,'tools');import version;print(version.VERSION)")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match tools/version.py ($version)"; exit 1; }
      - name: Corresponding source archive
        run: |
          name="SkylandersPC-${GITHUB_REF_NAME}-source"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" out/release
          git -c core.autocrlf=false archive HEAD | tar -x -C "$stage"
          git submodule foreach --quiet --recursive \
            'mkdir -p "'"$stage"'/$displaypath" && git archive HEAD | tar -x -C "'"$stage"'/$displaypath"'
          fetch() {  # repository commit destination
              git init -q "$3"
              git -C "$3" fetch -q --depth 1 "https://github.com/$1.git" "$2"
              git -C "$3" archive FETCH_HEAD | tar -x -C "$4"
          }
          mkdir -p "$stage/build-deps/vma" "$stage/build-deps/xbyak"
          fetch GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator "$VMA_COMMIT" "$RUNNER_TEMP/vma-git" "$stage/build-deps/vma"
          fetch herumi/xbyak "$XBYAK_COMMIT" "$RUNNER_TEMP/xbyak-git" "$stage/build-deps/xbyak"
          printf 'Built from %s at commit %s.\nSee README.md for build steps and .github/workflows/build.yml for the exact CI recipe.\nbuild-deps/ holds the pinned header-only renderer dependencies (VMA %s, xbyak %s).\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$VMA_COMMIT" "$XBYAK_COMMIT" > "$stage/SOURCE.txt"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" -czf "out/release/$name.tar.gz" "$name"
      - uses: actions/download-artifact@v5
        with:
          path: out/artifacts
      - name: Create the official release (draft until published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out/artifacts/SkylandersPC-windows && zip -qr "$GITHUB_WORKSPACE/out/release/SkylandersPC-${GITHUB_REF_NAME}-windows.zip" .)
          # Linux: the source tree with the prebuilt runtime and the launcher AppImage beside it.
          linux="$RUNNER_TEMP/SkylandersPC-linux"; mkdir -p "$linux"
          git -c core.autocrlf=false archive HEAD | tar -x -C "$linux"
          cp -a out/artifacts/SkylandersPC-linux-runtime/. "$linux/"
          chmod +x "$linux/.local/native-gpu-build/skylanders-native-host"
          install -m 755 out/artifacts/Skylanders-Launcher-x86_64.AppImage/*.AppImage "$linux/SkylandersPC.AppImage"
          tar -C "$RUNNER_TEMP" -czf "out/release/SkylandersPC-${GITHUB_REF_NAME}-linux.tar.gz" SkylandersPC-linux
          (cd out/release && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" out/release/* --draft --verify-tag \
            --title "SkylandersPC ${GITHUB_REF_NAME#v} Beta - Official Release" \
            --notes-file RELEASE_NOTES.md
