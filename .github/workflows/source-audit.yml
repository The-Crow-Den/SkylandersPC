# SPDX-License-Identifier: GPL-3.0-or-later
name: Source publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tracked source and notices
        run: python3 tools/release_audit.py --tracked
      - name: Test dependencies
        # Ubuntu's Python refuses system-wide pip installs (PEP 668). cryptography is a launcher,
        # trophy and package-extractor dependency (pinned as in tools/appimage/requirements.txt);
        # Pillow is needed only by the artwork-import tests. Qt UI tests skip without PyQt6.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check cryptography==50.0.2 pillow==13.0.0
      - name: Synthetic tooling tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v'
